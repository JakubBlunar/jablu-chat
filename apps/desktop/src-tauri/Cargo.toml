[package]
name = "jablu-desktop"
version = "1.0.2"
description = "Jablu Desktop"
authors = ["Jablu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jablu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
rdev = "0.5"

[target.'cfg(windows)'.dependencies]
# Auto-approve WebView2 microphone/camera permission prompts. Pinned to the same
# versions Tauri/wry already resolve so the ICoreWebView2 COM types line up.
webview2-com = "0.38"
windows = "0.61"
# Native Windows toasts with an in-process click handler so notification clicks
# can focus the window and deep-link. `tauri-plugin-notification` (via notify_rust)
# already pulls this in, but it doesn't expose the activation callback, so we use
# it directly. Same version already in the tree — no extra resolution.
tauri-winrt-notification = "0.7"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]
