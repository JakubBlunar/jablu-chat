# Local development: run only infrastructure services
# Usage: docker compose -f docker-compose.dev.yml up -d
# Then run the API and web app locally with `pnpm dev`

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-chat}
      # Default `dev` matches long-standing local volumes (`pgdata-dev`). Set `POSTGRES_PASSWORD`
      # in `.env` (e.g. `changeme` from `.env.example`) — Compose passes it in and matches new DBs.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev}
      - POSTGRES_DB=${POSTGRES_DB:-chat}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata-dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  livekit:
    image: livekit/livekit-server:v1.10.0
    ports:
      - '7880:7880'
      - '7882:7882/udp'
      - '50000-50100:50000-50100/udp'
    environment:
      - 'LIVEKIT_KEYS=devkey: devsecret'
    volumes:
      - ./docker/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml

  # Self-hosted MT for on-demand message translation. The host-run API reaches
  # it at http://localhost:5500 (set TRANSLATE_URL in .env.development).
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    ports:
      - '5500:5000'
    environment:
      - LT_LOAD_ONLY=${TRANSLATE_LANGUAGES:-en,cs,sk}
      - LT_THREADS=1
    volumes:
      # Mount at .local (exists in the image) so a fresh named volume is seeded
      # with the app's uid (1032) instead of root — see prod compose comment.
      - lt-models-dev:/home/libretranslate/.local
    mem_limit: 1.2g
    restart: unless-stopped

volumes:
  pgdata-dev:
  redisdata-dev:
  lt-models-dev:
