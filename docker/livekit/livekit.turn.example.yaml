# Copy to livekit.turn.yaml and replace turn.example.com with TURN_HOST.
# Used with docker-compose.traefik.yml; Traefik terminates TLS on 443.
# Set TURN_ENABLED=true and LIVEKIT_CONFIG_FILE=./docker/livekit/livekit.turn.yaml.
port: 7880
# The JS SDK opens the optional _data_track channel during voice joins.
enable_data_tracks: true
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  external_tls: true
  # Separate from the SFU media range; published by the Traefik Compose override.
  relay_range_start: 50101
  relay_range_end: 50200
logging:
  level: info
