port: 7880
# Match production: accept the optional _data_track channel created by the SDK.
enable_data_tracks: true
rtc:
  tcp_port: 7881
  # Single-port UDP mux avoids Windows/Hyper-V reserved ephemeral port ranges.
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
logging:
  level: info
