port: 7880
# The JS SDK opens the optional _data_track channel during voice joins.
enable_data_tracks: true
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
# Optional TURN/TLS: see docs/DEPLOYMENT.md (TURN for restrictive networks).
# Requires a separate public IP or an L4 TLS router on port 443.
logging:
  level: info
